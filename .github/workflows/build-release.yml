name: Build and Release

# 两种用法：
#
#   正式发版：推一个 v<x.y.z> 格式的 tag
#      构建 -> 打包 -> 生成 version.json -> 创建 GitHub Release -> 同步到 CNB
#
#   只验证流程（试跑）：在 Actions 页面手动触发，勾上 dry_run
#      只构建打包，不创建 Release、不同步 CNB、不占用任何版本号
#
# dry_run 这个开关是刻意加的。之前用真实版本号去验证发布流程，
# 把 v0.1.0 和 v0.1.1 白白消耗掉了，而当时程序还没有任何功能。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag，必须已存在，例如 v0.1.0。试跑模式下可以留空。'
        required: false
        type: string
      dry_run:
        description: '试跑模式：只构建打包，不创建 Release、不同步 CNB、不占用版本号'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PROJECT: SvcTool.csproj
  RUNTIME: win-x64
  # CNB 仓库路径，改动时同步修改 sync-cnb.yml / mirror-cnb.yml
  CNB_REPO: zmzhao/SvcTool

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}

    steps:
      # 解析动作放在最前面：它只读事件上下文，不需要仓库内容，
      # 而 Checkout 需要用这里算出来的 ref。
      - name: Resolve version and ref
        id: meta
        shell: pwsh
        run: |
          $isDryRun  = '${{ inputs.dry_run }}' -eq 'true'
          $inputTag  = '${{ inputs.tag }}'
          $refName   = '${{ github.ref_name }}'
          $githubRef = '${{ github.ref }}'

          if ($isDryRun) {
            # 试跑模式：版本号固定成一个一眼就能看出不是正式版的字符串，
            # 也不校验 tag 格式（试跑可能根本没有 tag）。
            $tag         = if ($inputTag) { $inputTag } else { 'dry-run' }
            $version     = '0.0.0-dryrun'
            $checkoutRef = if ($inputTag) { $inputTag } else { $githubRef }
            Write-Host '试跑模式：不创建 Release、不同步 CNB、不占用版本号'
          }
          else {
            $tag = if ($inputTag) { $inputTag } else { $refName }
            if ($tag -notmatch '^v\d+\.\d+\.\d+') {
              throw "tag '$tag' 不符合 v<major>.<minor>.<patch> 约定，拒绝发版"
            }
            $version     = $tag.Substring(1)
            $checkoutRef = $tag
          }

          "tag=$tag"                     >> $env:GITHUB_OUTPUT
          "version=$version"             >> $env:GITHUB_OUTPUT
          "ref=$checkoutRef"             >> $env:GITHUB_OUTPUT
          "dry_run=$($isDryRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "tag     = $tag"
          Write-Host "version = $version"
          Write-Host "ref     = $checkoutRef"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish (self-contained single-file exe)
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r $env:RUNTIME `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.meta.outputs.version }} `
            -o dist/exe

          Get-ChildItem dist/exe | Select-Object Name, Length | Format-Table -AutoSize

      - name: Package artifacts and version.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.meta.outputs.version }}'
          $tag     = '${{ steps.meta.outputs.tag }}'
          $base    = "SvcTool-$version-win-x64"

          New-Item -ItemType Directory -Force dist/assets | Out-Null

          # 便携版：单文件 exe
          Copy-Item dist/exe/SvcTool.exe "dist/assets/$base.exe"

          # 压缩包：exe + pdb，便于线上崩溃时排查
          Compress-Archive -Path dist/exe/SvcTool.exe, dist/exe/SvcTool.pdb `
                           -DestinationPath "dist/assets/$base.zip" -Force

          # version.json —— 程序内自动更新读的就是这个文件，字段保持稳定
          $files = Get-ChildItem dist/assets/* | ForEach-Object {
            $kind = switch ($_.Extension.ToLowerInvariant()) {
              '.exe'   { 'portable'  }
              '.zip'   { 'archive'   }
              '.msi'   { 'installer' }
              default  { 'other'     }
            }
            [ordered]@{
              name   = $_.Name
              size   = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              kind   = $kind
            }
          }

          $manifest = [ordered]@{
            version     = $version
            tag         = $tag
            releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            files       = @($files)
            mirrors     = [ordered]@{
              github = "https://github.com/${{ github.repository }}/releases/tag/$tag"
              cnb    = "https://cnb.cool/${{ env.CNB_REPO }}/-/releases/tag/$tag"
            }
          }

          # 必须是无 BOM 的 UTF-8：带 BOM 会坑到一部分 JSON 解析实现。
          # 用 .NET API 而不是 Set-Content -Encoding utf8NoBOM，这样 PowerShell 5.1 / 7 都能跑。
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/assets/version.json'),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host '--- assets ---'
          Get-ChildItem dist/assets | Select-Object Name, Length | Format-Table -AutoSize

      # 试跑模式：产物作为构建产物保留，方便下载检查，但不发布
      - name: Upload dry-run artifacts
        if: steps.meta.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SvcTool-dry-run-${{ github.run_number }}
          path: dist/assets/*
          retention-days: 7

      - name: Create / update GitHub Release
        if: steps.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          # 重跑时覆盖同名附件
          overwrite_files: true

  # 构建完成后立刻同步到 CNB。
  # 这里用 workflow_call 显式调用，而不是靠 mirror-cnb.yml 的 release: published 触发 ——
  # 因为上面那个 Release 是用默认 GITHUB_TOKEN 建的，而 GitHub 规定
  # 「用 GITHUB_TOKEN 产生的事件不会再触发新的 workflow 运行」，那个事件永远到不了。
  mirror:
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-cnb.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      prerelease: false
    secrets: inherit
