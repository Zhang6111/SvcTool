name: Mirror release to CNB

# 把 GitHub Release 的附件镜像到 CNB Release，供国内快速下载。
# 触发链：build-release.yml 建好 GitHub Release -> release published -> 这里。
# 失败不影响 GitHub 侧的发版，缺什么用 workflow_dispatch 指定 tag 补跑即可。
on:
  # 主路径：build-release.yml 建完 Release 后直接调用本 workflow。
  # 为什么不用 release: published 触发？因为 build-release.yml 是用默认的
  # GITHUB_TOKEN 建 Release 的，而 GitHub 规定「用 GITHUB_TOKEN 产生的事件
  # 不会再触发新的 workflow 运行」（防递归），所以那个事件永远不会到达。
  workflow_call:
    inputs:
      tag:
        description: 要镜像到 CNB 的 tag
        required: true
        type: string
      prerelease:
        description: 是否为预发布版本
        required: false
        type: boolean
        default: false
  # 兜底：在 GitHub 网页上「手动」发布 Release 时会走这里（这是用户行为，能触发）
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要镜像到 CNB 的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  # CNB 仓库路径，改动时同步修改 build-release.yml / sync-cnb.yml
  CNB_REPO: zmzhao/SvcTool

concurrency:
  group: mirror-cnb-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.event.release.tag_name }}'
          if [ -z "$tag" ]; then
            echo '::error::无法确定要镜像的 tag'
            exit 1
          fi

          # 预发布版本不抢 latest，否则程序内更新会把用户升到 beta
          if [ '${{ inputs.prerelease || github.event.release.prerelease }}' = 'true' ]; then
            make_latest=false
          else
            make_latest=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag  make_latest=$make_latest"

      # 没配 secret 时不要挂红叉，给个明确提示然后跳过
      - name: Check CNB_TOKEN
        id: guard
        run: |
          if [ -z '${{ secrets.CNB_TOKEN }}' ]; then
            echo '::warning title=缺少 CNB_TOKEN::CNB 附件镜像已跳过。请到 Settings -> Secrets and variables -> Actions 添加名为 CNB_TOKEN 的 secret。'
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # 需要完整历史：下面要把 tag 从本地推到 CNB，而浅克隆是推不出去的
          fetch-depth: 0

      # sync-cnb.yml 和本 workflow 是被同一个 tag push 并行触发的，存在竞态：
      # 走到这里时 CNB 上可能还没有这个 tag，建 Release 会失败。
      # 所以这里幂等地把 tag 自己推过去，让本 workflow 不依赖 sync-cnb 是否完成。
      - name: Ensure tag exists on CNB
        if: steps.guard.outputs.skip != 'true'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # 用 credential helper 而不是把 token 拼进 remote URL，
          # 避免出错时 token 随 URL 出现在日志里
          git config --local 'credential.https://cnb.cool.helper' \
            '!f() { echo username=cnb; echo "password=$CNB_TOKEN"; }; f'
          git remote add cnb "https://cnb.cool/$CNB_REPO.git"
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG"
          git push cnb "refs/tags/$TAG" --force

      - name: Download assets from GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download '${{ steps.meta.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --dir dist \
            --clobber
          ls -l dist

      - name: Upload assets to CNB
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/cnb-release
        with:
          repo: ${{ env.CNB_REPO }}
          tag: ${{ steps.meta.outputs.tag }}
          title: ${{ steps.meta.outputs.tag }}
          dir: dist
          token: ${{ secrets.CNB_TOKEN }}
          make-latest: ${{ steps.meta.outputs.make_latest }}
          body: |
            本版同步自 GitHub Release `${{ steps.meta.outputs.tag }}`。

            原始发布：https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}

      # 这一步不带任何鉴权，顺带验证「匿名能否下载」——这是程序内自动更新的前提
      - name: Verify public download URLs
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          status=0
          for f in dist/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            want="$(stat -c '%s' "$f")"
            for url in \
              "https://cnb.cool/$CNB_REPO/-/releases/download/$TAG/$name" \
              "https://cnb.cool/$CNB_REPO/-/releases/latest/download/$name"
            do
              got="$(curl -sSL -o /dev/null -w '%{size_download}' --max-time 120 "$url" || echo 0)"
              if [ "$got" = "$want" ]; then
                echo "OK   $url  ($got 字节)"
              else
                echo "::warning::下载校验不通过：$url （期望 $want 字节，实际 $got 字节）"
                status=1
              fi
            done
          done
          exit $status
